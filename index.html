
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 宣傳文案工作室 V3</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f5fa;
      font-family: system-ui, sans-serif;
      color: #202638;
    }
    main {
      max-width: 680px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px #17255412;
    }
    h1 { margin-top: 0; color: #3155bb; }
    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }
    textarea { min-height: 100px; }
    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #3155bb;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #generate { width: 100%; margin-top: 22px; }
    #status { margin: 15px 0; color: #475569; }
    #result {
      white-space: pre-wrap;
      line-height: 1.8;
      background: #f8fafc;
      padding: 18px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    #copy { margin-top: 12px; }
    footer {
      margin-top: 22px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main>
    <h1>✨ AI 宣傳文案工作室 V3</h1>
    <p>輸入活動資訊，讓 Gemini AI 幫你撰寫宣傳文案。</p>

    <label for="shop">店家名稱</label>
    <input id="shop" maxlength="80"
      placeholder="例如：幸福咖啡">

    <label for="offer">活動內容</label>
    <textarea id="offer" maxlength="300"
      placeholder="例如：週末第二杯半價"></textarea>

    <label for="platform">發布平台</label>
    <select id="platform">
      <option>Instagram</option>
      <option>Facebook</option>
      <option>LINE</option>
    </select>

    <button id="generate" type="button">
      ✨ AI 產生宣傳文案
    </button>

    <p id="status" role="status"></p>

    <section id="output" hidden>
      <h2>AI 生成結果</h2>
      <div id="result"></div>
      <button id="copy" type="button">複製文案</button>
    </section>

    <footer>
      V3 Gemini AI 版本｜請勿輸入個人敏感資料
    </footer>
  </main>

  <script>
    const API_URL =
      "https://ai-copy-studio-api.sandy20171205.workers.dev/";

    const shop = document.getElementById("shop");
    const offer = document.getElementById("offer");
    const platform = document.getElementById("platform");
    const generate = document.getElementById("generate");
    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const result = document.getElementById("result");
    const copy = document.getElementById("copy");

    generate.addEventListener("click", async () => {
      const shopValue = shop.value.trim();
      const offerValue = offer.value.trim();

      if (!shopValue || !offerValue) {
        status.textContent = "請填寫店家名稱和活動內容。";
        return;
      }

      generate.disabled = true;
      output.hidden = true;
      status.textContent = "AI 正在撰寫文案，請稍候…";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            shop: shopValue,
            offer: offerValue,
            platform: platform.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "API 請求失敗：" + response.status
          );
        }

        if (typeof data.result !== "string") {
          throw new Error("AI 回傳格式不正確");
        }

        result.textContent = data.result;
        output.hidden = false;
        status.textContent = "文案產生完成！";
      } catch (error) {
        status.textContent =
          "產生失敗：" + error.message;
      } finally {
        generate.disabled = false;
      }
    });

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(
          result.textContent
        );
        status.textContent = "文案已複製！";
      } catch {
        status.textContent =
          "無法自動複製，請手動選取文案。";
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>AI 宣傳文案工作室</title>
<style>
body {
  font-family: system-ui,sans-serif;
  background:#f4f3fa;
  margin:0;
  padding:20px;
  color:#27233a;
}
main {
  max-width:540px;
  margin:30px auto;
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 8px 28px #24204012;
}
h1 {font-size:25px}
label {display:block;margin-top:18px;font-weight:600}
input,textarea,select,button {
  box-sizing:border-box;
  width:100%;
  font:inherit;
  padding:13px;
  margin-top:8px;
  border-radius:10px;
}
input,textarea,select {border:1px solid #ccc}
button {
  background:#6453d6;
  color:white;
  border:0;
  margin-top:20px;
  cursor:pointer;
}
#result {
  white-space:pre-wrap;
  background:#f3f0ff;
  padding:18px;
  border-radius:12px;
  margin-top:20px;
}
small {color:#666}
</style>
</head>
<body>
<main>
<h1>✨ AI 宣傳文案工作室</h1>
<p>30 秒產生你的行銷文案</p>
<label>店家名稱</label>
<input id="shop" placeholder="例如：幸福咖啡">
<label>活動內容</label>
<textarea id="offer"
 placeholder="例如：週末第二杯半價"></textarea>
<label>文案風格</label>
<select id="tone">
<option value="friendly">親切活潑</option>
<option value="pro">專業質感</option>
<option value="sale">限時促銷</option>
</select>
<button onclick="generate()">產生文案</button>
<div id="result" hidden></div>
<button id="copy" onclick="copyText()" hidden>
複製文案
</button>
<p><small>免費試用版｜範本自動產生</small></p>
</main>
<script>
let currentText="";
function generate(){
 const shop=document.getElementById("shop").value.trim();
 const offer=document.getElementById("offer").value.trim();
 const tone=document.getElementById("tone").value;
 if(!shop||!offer){
   alert("請填寫店家名稱及活動內容");
   return;
 }
 const templates={
  friendly:`✨ ${shop}有好消息！
${offer}！
快揪朋友一起來看看吧 ❤️`,
  pro:`讓日常多一份美好。
${shop}推出「${offer}」。
歡迎了解活動詳情。`,
  sale:`🔥 限時活動推薦！
${shop}推出「${offer}」！
歡迎立即洽詢活動資訊。`
 };
 currentText=templates[tone]+
 `\n\n#${shop.replace(/\s/g,"")} #活動推薦`;
 document.getElementById("result").textContent=currentText;
 document.getElementById("result").hidden=false;
 document.getElementById("copy").hidden=false;
}
async function copyText(){
 try{
  await navigator.clipboard.writeText(currentText);
  alert("已複製文案");
 }catch(e){
  alert("請長按文案選取並複製");
 }
}
</script>
</body>
</html>
